<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Calculator</title>
  <style>
    /* --- basic styling (feel free to change) --- */
    body { font-family: Arial, sans-serif; display: flex; justify-content: center;
           padding-top: 40px; background: #f0f2f5; }
    .calculator { width: 260px; background: #20232a; padding: 16px; border-radius: 12px; }
    #display { width: 100%; height: 60px; font-size: 28px; text-align: right;
               border: none; border-radius: 8px; padding: 0 12px; margin-bottom: 12px;
               box-sizing: border-box; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    button { height: 52px; font-size: 20px; border: none; border-radius: 8px;
             cursor: pointer; background: #3a3f4b; color: white; }
    button:hover { background: #4a5060; }
    .operator { background: #61dafb; color: #20232a; }
    .equals { background: #f7df1e; color: #20232a; grid-column: span 2; }
    .clear { background: #ff6b6b; }
  </style>
</head>
<body>

  <div class="calculator">
    <input id="display" value="0" disabled>
    <div class="buttons">
      <button class="clear" onclick="clearAll()">C</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>
      <button onclick="pressNumber('7')">7</button>
      <button onclick="pressNumber('8')">8</button>
      <button onclick="pressNumber('9')">9</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>
      <button onclick="pressNumber('4')">4</button>
      <button onclick="pressNumber('5')">5</button>
      <button onclick="pressNumber('6')">6</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>
      <button onclick="pressNumber('1')">1</button>
      <button onclick="pressNumber('2')">2</button>
      <button onclick="pressNumber('3')">3</button>
      <button onclick="pressNumber('0')">0</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    // ===== STATE: variables that remember what's happening =====
    let currentInput = "";   // the number being typed now
    let firstNumber = null;  // the first number entered
    let operator = null;     // the chosen operation (+ - * /)

    const display = document.getElementById("display");

    // show something on the calculator screen
    function updateDisplay(value) {
      display.value = value;
    }

    // ===== when a NUMBER button is pressed =====
    function pressNumber(digit) {
      currentInput = currentInput + digit;   // build the number as text
      updateDisplay(currentInput);
    }

    // ===== when an OPERATOR button is pressed =====
    function chooseOperator(op) {
      firstNumber = Number(currentInput);  // save the first number (as a NUMBER!)
      operator = op;                       // remember the operation
      currentInput = "";                   // clear input for the second number
    }

    // ===== the MATH: a function that returns a result =====
    function operate(a, b, op) {
      if (op === "+") return a + b;
      if (op === "-") return a - b;
      if (op === "*") return a * b;
      if (op === "/") {
        if (b === 0) return "Error";       // handle divide-by-zero
        return a / b;
      }
    }

    // ===== when EQUALS is pressed =====
    function calculate() {
      const secondNumber = Number(currentInput);
      const result = operate(firstNumber, secondNumber, operator);
      updateDisplay(result);
      currentInput = String(result);       // let the answer be reused
    }

    // ===== when CLEAR is pressed =====
    function clearAll() {
      currentInput = "";
      firstNumber = null;
      operator = null;
      updateDisplay("0");
    }

    // TODO (make it your own): add a decimal point, a backspace,
    // a percent button, or keyboard support!
  </script>
</body>
</html>
